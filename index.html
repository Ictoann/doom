<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOOM Fullscreen</title>
    <style>
        /* Force zero margins and lock scrollbars for true fullscreen */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Lock canvas aspect ratio perfectly across monitors */
        canvas {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>

    <!-- Native Emscripten renderer container -->
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script type="text/javascript">
        var Module = {
            canvas: document.getElementById('canvas'),
            // Automatically points the native compiler arguments directly to your file
            arguments: ["-iwad", "DOOM1.WAD", "-window"],
            print: console.log,
            printErr: console.error
        };

        window.addEventListener('load', () => {
            // Dynamically injects the unblocked open-source WebAssembly compiler loop
            var script = document.createElement('script');
            script.src = "https://github.io";
            script.async = true;
            document.body.appendChild(script);
            
            // Force keyboard focus immediately onto the game canvas window
            Module.canvas.focus();
        });
    </script>

</body>
</html>
