<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOOM Fullscreen</title>
    <!-- Use V8 standalone styles and scripts -->
    <link rel="stylesheet" href="https://js-dos.com">
    <script src="https://js-dos.com"></script>
    <style>
        /* Force true fullscreen layout and kill native bars */
        html, body { 
            margin: 0; 
            padding: 0; 
            background: #000; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
        }
        #jsdos-container { 
            width: 100vw; 
            height: 100vh; 
        }
        /* Style adjustments to make the emulator UI fill out completely */
        .jsdos-canvas {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div id="jsdos-container"></div>

    <script>
        // Start the standalone runner directly on your repo's file
        Dos(document.getElementById("jsdos-container"))
            .run("./DOOM1.WAD");
    </script>

</body>
</html>
