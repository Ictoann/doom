<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play DOOM1.WAD</title>
    <!-- Native JS WAD Renderer Engine -->
    <script src="https://github.io"></script>
    <style>
        html, body { 
            margin: 0; padding: 0; background: #111; color: #fff;
            font-family: sans-serif; text-align: center;
            width: 100%; height: 100%; overflow: hidden;
        }
        #canvas { 
            display: block; margin: 20px auto; 
            background: #000; border: 4px solid #333;
            max-width: 100vw; max-height: 80vh; 
        }
        .controls { color: #aaa; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>DOOM 1 Player</h2>
    <canvas id="canvas" width="640" height="400"></canvas>
    
    <div class="controls">
        Controls: <b>W, A, S, D</b> or <b>Arrow Keys</b> to Move & Rotate.
    </div>

    <script>
        window.addEventListener('load', () => {
            // Initializes the JS engine on the canvas element
            const doom = new Doom(document.getElementById('canvas'));
            
            // Native fetch loads DOOM1.WAD cleanly without cross-origin blocks
            doom.loadWad('./DOOM1.WAD')
                .then(() => {
                    doom.start();
                })
                .catch(err => {
                    console.error("Error loading WAD:", err);
                    document.body.innerHTML += `<p style='color:red;'>Failed to load DOOM1.WAD. Verify the filename matches exactly.</p>`;
                });
        });
    </script>

</body>
</html>
