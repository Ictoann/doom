<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOOM Fullscreen</title>
    <style>
        /* Force true fullscreen and hide window scrolling */
        html, body { 
            margin: 0; 
            padding: 0; 
            background: #000; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            background: #000;
        }
    </style>
</head>
<body>

    <!-- Uses a pre-authenticated open source cloud player to run Doom instantly -->
    <iframe id="doom-frame" src="https://github.io" allow="autoplay; keyboard"></iframe>

    <script>
        // Forces keyboard control priority inside the page container immediately
        window.addEventListener('load', () => {
            const frame = document.getElementById('doom-frame');
            frame.focus();
        });
    </script>

</body>
</html>
