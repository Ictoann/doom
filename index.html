<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOOM</title>
    <!-- Native JS WAD Renderer Engine -->
    <script src="https://github.io"></script>
    <style>
        /* Force true fullscreen and kill scrollbars */
        html, body { 
            margin: 0; 
            padding: 0; 
            background: #000; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Make the game canvas stretch to fill the browser exactly */
        #canvas { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
            object-fit: contain; /* Preserves Doom's classic retro aspect ratio */
            background: #000; 
        }
        /* Loading Status Text */
        #status {
            position: absolute;
            color: #ff0000;
            font-family: monospace;
            font-size: 1.5rem;
            text-shadow: 2px 2px #000;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="status">LOADING DOOM1.WAD...</div>
    <canvas id="canvas" width="640" height="400"></canvas>

    <script>
        window.addEventListener('load', () => {
            const canvas = document.getElementById('canvas');
            const statusText = document.getElementById('status');
            const doom = new Doom(canvas);
            
            // Fetch the WAD and wait dynamically until download completes
            doom.loadWad('./DOOM1.WAD')
                .then(() => {
                    statusText.style.display = 'none'; // Hide loading text
                    doom.start();
                    canvas.focus(); // Force focus so keys work instantly
                })
                .catch(err => {
                    console.error("Error loading WAD:", err);
                    statusText.innerText = "ERROR: Could not load DOOM1.WAD. Check file capitalization.";
                });
        });
    </script>

</body>
</html>
