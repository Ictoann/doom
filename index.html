<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Play DOOM in Browser</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- js-dos CSS -->
    <link rel="stylesheet" href="https://js-dos.com">
    <!-- js-dos API -->
    <script src="https://js-dos.com"></script>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #eee;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 { margin-bottom: 10px; font-size: 1.5rem; }
        #canvas {
            width: 640px;
            height: 400px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <h1>Classic DOOM</h1>
    <div id="canvas"></div>

    <script>
        Dos(document.getElementById("canvas"), {
            url: "https://js-dos.com",
        }).ready((app) => {
            // Game loaded successfully
        });
    </script>
</body>
</html>
