<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOOM Player</title>
    <style type="text/css">
        body { 
            background: #111; 
            color: #fff; 
            font-family: sans-serif; 
            text-align: center; 
            padding-top: 30px; 
            margin: 0;
        }
        /* Container box for the game */
        #game-wrapper {
            position: relative;
            width: 640px; 
            height: 400px; 
            margin: 0 auto; 
            background: #000; 
            border: 4px solid #333;
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
        button { 
            margin-top: 15px; 
            padding: 10px 20px; 
            font-weight: bold; 
            background: #ff0000; 
            color: #fff; 
            border: none; 
            cursor: pointer; 
        }
        button:hover { background: #cc0000; }
    </style>
</head>
<body>

    <h2>My Doom Page</h2>
    
    <div id="game-wrapper">
        <!-- Native sandboxed web engine running your exact file -->
        <iframe id="doom-frame" src=""></iframe>
    </div>
    
    <button onclick="goFullscreen()">Make fullscreen</button>
    
    <script type="text/javascript">
        window.addEventListener('load', () => {
            // Find the location of your repository automatically
            const baseUrl = window.location.href.split('?')[0].replace(/\/\$/, "");
            const wadUrl = `${baseUrl}/DOOM1.WAD`;
            
            // Streams your local WAD file straight through a plug-and-play HTML5 engine
            const emulatorUrl = `https://github.io{encodeURIComponent(wadUrl)}`;
            document.getElementById('doom-frame').src = emulatorUrl;
        });

        // Fullscreen browser controller
        function goFullscreen() {
            const frame = document.getElementById("doom-frame");
            if (frame.requestFullscreen) frame.requestFullscreen();
            else if (frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();
            else if (frame.msRequestFullscreen) frame.msRequestFullscreen();
        }
    </script>
</body>
</html>
